# ================================================================== 
# LAPRAS specific section
# ================================================================== 
function usage {
        echo "./$(basename $0) -h anything --> shows usage"
        echo "./$(basename $0) -L 1 --> use when executed from lapras to suppres colors"
}

# list of arguments expected in the input
optstring=":h:L:"

# should be set to 1 if called trough Lapras
# The var needs to have a  name than the one used in other scripts (simply LAPRAS_MODE) in order not to change the value for the rest
LAPRAS_MODE_FUNC=0

#if [[ "$@" == "-L 1" ]] ; then echo "Coloring functions will be initialized in LAPRAS_MODE." ; LAPRAS_MODE_FUNC=1 ; fi
if [[ "$@" == "-L 1" ]] ; then LAPRAS_MODE_FUNC=1 ; fi

# ================================================================== 
# formatting variales
# ================================================================== 
NORMAL=`echo "\033[m"`
FGRED=`echo "\033[41m"`

BLUE=`echo "\033[36m"` # blue
YELLOW=`echo "\033[33m"` # yellow
RED=`echo "\033[31m"` # red 
GREEN=`echo "\033[32m"` # green

function print_fgred () {
  if [ $LAPRAS_MODE_FUNC -eq 1 ]
  then
   echo -ne " $@ "
  else
   echo -ne "${FGRED} $@ ${NORMAL}"
  fi
}

function print_blue () {
  if [ $LAPRAS_MODE_FUNC -eq 1 ]
  then
   echo -ne " $@ "
  else
   echo -ne "${BLUE} $@ ${NORMAL}"
  fi
}

function print_yellow () {
  if [ $LAPRAS_MODE_FUNC -eq 1 ]
  then
   echo -ne " $@ "
  else
   echo -ne "${YELLOW} $@ ${NORMAL}"
  fi
}

function print_red () {
  if [ $LAPRAS_MODE_FUNC -eq 1 ]
  then
   echo -ne " $@ "
  else
   echo -ne "${RED} $@ ${NORMAL}"
  fi
}

function print_green () {
  if [ $LAPRAS_MODE_FUNC -eq 1 ]
  then
   echo -ne " $@ "
  else
   echo -ne "${GREEN} $@ ${NORMAL}"
  fi
}

function print_time () {
  if [ "$LAPRAS_MODE_FUNC" -eq 1 ]
  then
   echo -ne " "`date -u "+%Y/%m/%d-%H:%M:%S UTC"`" "
  else
   if [ -z $1 ] || [ "$1" == "GREEN" ] ; then 
    echo -ne " ${GREEN}"`date -u "+%Y/%m/%d-%H:%M:%S UTC"`"${NORMAL} "
   elif [ "$1" == "RED" ] ; then
    echo -ne " ${RED}"`date -u "+%Y/%m/%d-%H:%M:%S UTC"`"${NORMAL} "
   elif [ "$1" == "YELLOW" ] ; then
    echo -ne " ${YELLOW}"`date -u "+%Y/%m/%d-%H:%M:%S UTC"`"${NORMAL} "
   else
    echo -ne " ${GREEN}"`date -u "+%Y/%m/%d-%H:%M:%S UTC"`"${NORMAL} "
   fi
  fi
# if any parameter has been passed this is the color which will be used
 # if [ -z $1 ]
 # then
  # echo -ne " ${GREEN}"`date -u "+%Y/%m/%d-%H:%M:%S UTC"`"${NORMAL} "
 # else
  # echo -ne " ${RED}"`date -u "+%Y/%m/%d-%H:%M:%S UTC"`"${NORMAL} "
 # fi
}


# $1 should be the UUID and #2 is optional and is what is being deployed
# providing UUID as $1 will only print the % completion till 100%
# both $1 and $2 (different than NONE) will print also what is being deployed
# specifying $2 equal to NONE will make the function return only 1 value instead of looping till the task is finished
# $2 different than NONE and anything as 3 will return timestamped single value with the msg
function monitor_task_progress () {
task_completion=0
 if [ -z $1 ] ; then
   echo `print_red "No task UUID specified. Exiting (231) ..."` ; exit 231
 else
   if [ -z "$2" ] && [ -z "$3"]; then
     while [ $task_completion -lt 100 ]
      do
       task_completion=$(ecli task.get $1 | grep "percentage_complete" | sed -e 's/,//g' |  awk '{print $NF}')
       echo -ne `print_blue "${task_completion}%"`
       sleep 5
     done
   elif [ "$2" == "NONE" ] ; then
       task_completion=$(ecli task.get $1 | grep "percentage_complete" | sed -e 's/,//g' |  awk '{print $NF}')
       echo -ne `print_blue "${task_completion}%"`
   else
     if [ -z "$3" ] ; then
      while [ $task_completion -lt 100 ]
       do
        task_completion=$(ecli task.get $1 | grep "percentage_complete" | sed -e 's/,//g' |  awk '{print $NF}')
        echo "["`print_time`"] $2: "`print_blue "$task_completion"`"%"
        sleep 5
      done
	 else
	   task_completion=$(ecli task.get $1 | grep "percentage_complete" | sed -e 's/,//g' |  awk '{print $NF}')
	   echo "["`print_time`"] $2:"`print_blue "$task_completion"`"%"
	 fi
   fi
 fi
}

function get_available_clusters ()
{
  subfolder="./payload/afs_cluster_configs"
  result=$(
    find "$subfolder" -maxdepth 1 -type f -name '*.json' |
    sed 's|.*/||; s/\.json$//' |
    sort |
    paste -sd' ' -
  )
  echo "$result"
}


