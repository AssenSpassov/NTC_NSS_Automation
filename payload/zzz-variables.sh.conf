#!/bin/bash

# author: Assen Spassov (as@nutanix.com)
# this file is meant to be copied over and executed on a CVM

# list of arguments expected in the input
optstring=":h"

while getopts ${optstring} arg; do
  case ${arg} in
    h)
      usage
      ;;
    :)
      echo "$0: Must supply an argument to -$OPTARG." >&2
      exit 1
      ;;
    ?)
      echo "Invalid option: -${OPTARG}."
      exit 2
      ;;
  esac
done

# ================================================================== 
# importing formatting functions and setting testing mode
# ================================================================== 
TESTING_MODE=0
if [ -d ./payload ] 
then
  if [ -f ./payload/zzz-functions.sh.conf ]
  then
   source "./payload/zzz-functions.sh.conf"
      if [ -f ./payload/TESTING_MODE.marker ]
       then
        TESTING_MODE=1
      fi
  else 
   echo "Failed to import formatting functions! Exiting ... (255)" ; exit 255
  fi
else 
  if [ -f ./zzz-functions.sh.conf ]
   if [ -f ./TESTING_MODE.marker ]
    then
     TESTING_MODE=1
   fi
  then
   source "./zzz-functions.sh.conf"
  else 
   echo "Failed to import formatting functions! Exiting ... (255)" ; exit 255
  fi
fi

# ================================================================== 
# Global tweakable variables
# ================================================================== 
print_yellow "Initializing global variables..." ; echo 

ntc_vars_conf_file="/tmp/ntc_vars.conf"
ntc_ctr_name="NTC-container" # to be used for all the VMs and images
dhcp_net_name="DHCP" # also used in 00-prereq_infra.sh
dhcp_net_VLAN_ID="102" # also used in 00-prereq_infra.sh
native_net_name_managed="VLAN0-managed" # also used in 00-prereq_infra.sh
native_net_name_notmanaged="MGMT" # also used in 00-prereq_infra.sh
native_net_VLAN_ID_notmanaged="0" # also used in 00-prereq_infra.sh

# ISCSI managed network
# acli net.create ISCSI vlan=121 ip_config=192.168.121.254/24; acli net.add_dhcp_pool ISCSI start={{iscsi_start}} end={{iscsi_end}}; acli net.update_dhcp_dns ISCSI domains=learn.local servers=10.63.64.125
iscsi_net_name="ISCSI"
iscsi_net_VLAN_ID="121"
iscsi_net_ip_config="192.168.121.254/24"
iscsi_net_address="192.168.121.0"
iscsi_net_pool_start_ip="" # need to calculate based on cluster VIP after it has been saved further down
iscsi_net_pool_end_ip="" # need to calculate based on cluster VIP after it has been saved further down
iscsi_net_domain="learn.local"
iscsi_net_dns_server="10.63.64.125"

echo -ne "Container to use:" ; print_blue ${ntc_ctr_name} ; echo
echo -ne "DHCP network to use:"; print_blue ${dhcp_net_name} ; echo
echo -ne "Native managed network to use (name):"`print_blue ${native_net_name_managed}` ; echo
echo -ne "Native network to use (name):"`print_blue ${native_net_name_notmanaged}` ; echo

prism_username="admin"
prism_password=""

# ================================================================== 
# derived cluster specific variables 
# DONE 2020-09-30 15:21 CET ; TODO 2020-09-30 13:09 CET - add colors and exception catching, e.g. DSIP not being set and resulting in: "Data services IP on serviceability-1 is :" being printed
# ================================================================== 
if [ -f $ntc_vars_conf_file ] && [ `cat $ntc_vars_conf_file | wc -l` -gt 8 ]
then
 echo `print_blue $ntc_vars_conf_file`"exists with more than 8 variables in it. It will be reused. If there are any problems connect to the cluster and do \"allssh rm $ntc_vars_conf_file\""
 echo "Here is the current contents:"
 cat $ntc_vars_conf_file
 source $ntc_vars_conf_file
else
 echo -ne ""
 print_yellow "Gathering cluster specific information and storing in "`print_blue $ntc_vars_conf_file`"..."; echo

 if [ -f $ntc_vars_conf_file ] ; then rm $ntc_vars_conf_file ; fi

 echo "# To be used for NTC/NSS automation" >> $ntc_vars_conf_file

 cluster_name=$(ncli cluster info | awk '/Name/ {print tolower($NF)}')
 echo "Cluster is:"`print_blue ${cluster_name}`
 echo "cluster_name=$cluster_name" >> $ntc_vars_conf_file

 cluster_full_version=$(ncli cluster info | awk '/Full Version/ {print tolower($NF)}')
 echo "Cluster Full Version is:"`print_blue ${cluster_full_version}`
 echo "cluster_full_version=$cluster_full_version" >> $ntc_vars_conf_file

 cluster_version=$(ncli cluster info | awk '/r Version/ {print tolower($NF)}')
 echo "Cluster Version is:"`print_blue ${cluster_version}`
 echo "cluster_version=$cluster_version" >> $ntc_vars_conf_file

 ncc_version=$(ncc --version)
 echo "NCC version is:"`print_blue ${ncc_version}`
 echo "ncc_version=$ncc_version" >> $ntc_vars_conf_file

 def_ctr_name=$(ncli ctr ls | grep -i defau | head -n1 | awk '{ print $NF }')
 echo "Default container on"`print_blue ${cluster_name}`"is"`print_blue ${def_ctr_name}`
 echo "def_ctr_name=$def_ctr_name" >> $ntc_vars_conf_file

 def_sp_name=$(ncli sp ls | awk '/Name/ {print $ NF}')
 echo "Default storage pool on"`print_blue ${cluster_name}`"is"`print_blue ${def_sp_name}`
 echo "def_sp_name=$def_sp_name" >> $ntc_vars_conf_file

 cluster_dsip=$(ncli cluster info | awk '/External Data/ {print $NF}')
 if [ $cluster_dsip == ":" ] ; then echo "The cluster DSIP is"`print_red "not set."` ; else echo "Data services IP on"`print_blue ${cluster_name}`"is"`print_blue ${cluster_dsip}`; fi
 echo "cluster_dsip=$cluster_dsip" >> $ntc_vars_conf_file

 cluster_vip=$(ncli cluster info | awk '/External IP/ {print $NF}')
 if [ $cluster_vip == ":" ] ; then echo "The cluster VIP is"`print_red "not set."` ; else echo "Cluster VIP on"`print_blue ${cluster_name}`"is"`print_blue ${cluster_vip}`; fi
 echo "cluster_vip=$cluster_vip" >> $ntc_vars_conf_file

base_net_ip=`echo $iscsi_net_address | awk -F\. '{$(NF--)="" ; print}' | sed 's/\ /./g'` # get the iscsi network address without last octet
iscsi_net_pool_start_offset=60 # should -14 for delivery clusters; so replace the + in the next line as well
iscsi_net_pool_start_ip=${base_net_ip}$((`echo $cluster_vip | awk -F\. '{print $NF}'`+$iscsi_net_pool_start_offset)) # VIP-iscsi_net_pool_start_offset
iscsi_net_pool_end_offset=70 # should -5 for delivery clusters; so replace the + in the next line as well
iscsi_net_pool_end_ip=${base_net_ip}$((`echo $cluster_vip | awk -F\. '{print $NF}'`+$iscsi_net_pool_end_offset)) # VIP_LAST_OCTET-iscsi_net_pool_end_offset

 rest_api_user="rest_api_user"
 echo "rest_api_user=$rest_api_user" >> $ntc_vars_conf_file
 echo "Rest API user to create"`print_blue $rest_api_user`

 tmp_dw_path=$(df -h | grep stargate-storage | head -n 1 | awk '{print $NF}')
 dw_path="${tmp_dw_path}/tmp"
 echo "dw_path=${dw_path}" >> $ntc_vars_conf_file
 echo "Path to download SW to:"`print_blue $dw_path`
fi 
if [ ! -d $dw_path ] ; then echo -n "Folder"`print_blue $dw_path`"does not exuist. Creating ... ";  mkdir $dw_path ; echo `print_green "[DONE]"`; else echo "Folder"`print_blue $dw_path`"is present. Will reuse it. " ; fi

